name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - staging
          - production

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
  HEALTH_PATH: /api/public.php

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          if [[ -z "${{ env.DEPLOY_HOST }}" ]]; then echo "DEPLOY_HOST is required"; exit 1; fi
          if [[ -z "${{ env.DEPLOY_USER }}" ]]; then echo "DEPLOY_USER is required"; exit 1; fi
          if [[ -z "${{ env.SSH_KEY }}" ]]; then echo "DEPLOY_SSH_KEY is required"; exit 1; fi

      - name: Setup SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH key loaded ($(wc -c < ~/.ssh/deploy_key) bytes)"

      - name: Test SSH connection
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -x
          ssh -v -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@$HOST" \
            "echo 'SSH OK'; pwd; ls -ld ~/public_html" 2>&1 || true
          echo "--- EXIT CODE: $? ---"

      - name: Backup current production
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USERNAME: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@$HOST" \
            "rm -rf ~/public_html_backup && cp -r ~/public_html ~/public_html_backup"
          echo "Backup saved to ~/public_html_backup"

      - name: Deploy to production
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.environment == 'production'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USERNAME: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='config/config.php' \
            --exclude='.env' \
            ./ \
            "${{ secrets.DEPLOY_USER }}@$HOST:~/public_html/"

      - name: Deploy to staging
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USERNAME: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='config/config.php' \
            --exclude='.env' \
            ./ \
            "${{ secrets.DEPLOY_USER }}@$HOST:~/public_html-staging/"

      - name: Health check
        run: |
          sleep 5
          curl -fsS http://${{ env.DEPLOY_HOST }}${{ env.HEALTH_PATH }} | head -c 200
